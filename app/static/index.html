<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic RAG Assistant</title>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #2563eb; --border: #e2e8f0; --chip: #eff6ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --border: #30363d; --chip: #1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 "Segoe UI", Tahoma, system-ui, sans-serif; }
  main { max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; }
  button { padding: 0 20px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .examples { margin: 12px 0 24px; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { background: var(--chip); color: var(--text); border: 1px solid var(--border); padding: 4px 12px; font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .answer { font-size: 1.15rem; font-weight: 600; }
  .label { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
  .source .title { font-weight: 600; }
  .source .text { color: var(--muted); font-size: 0.95rem; }
  .hidden { display: none; }
  .error { color: #dc2626; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>مساعد الأسئلة العربي</h1>
  <p class="sub">يجيب من مقالات ويكيبيديا العربية ويعرض المصادر التي اعتمد عليها. <a href="/docs" dir="ltr">API docs</a></p>
  <form id="form">
    <input id="q" placeholder="اكتب سؤالك هنا..." autocomplete="off" required>
    <button id="go" type="submit">اسأل</button>
  </form>
  <div class="examples" id="examples"></div>
  <div id="out" class="hidden">
    <div class="card"><div class="label">الإجابة</div><div class="answer" id="answer"></div></div>
    <div class="label">المصادر</div>
    <div id="sources"></div>
  </div>
  <p class="error" id="error"></p>
</main>
<script>
  const EXAMPLES = [
    "في أي عام حصل ألبرت أينشتاين على جائزة نوبل؟",
    "من رسم الموناليزا؟",
    "ما الجائزة التي حصل عليها نجيب محفوظ؟",
    "بماذا لقب توماس إديسون؟",
  ];
  const ex = document.getElementById("examples");
  ex.innerHTML = EXAMPLES.map(q => `<button type="button">${q}</button>`).join("");
  ex.addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") { document.getElementById("q").value = e.target.textContent; ask(); }
  });
  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(); });

  const escape = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function ask() {
    const question = document.getElementById("q").value.trim();
    if (!question) return;
    const go = document.getElementById("go");
    go.disabled = true; go.textContent = "...";
    document.getElementById("error").textContent = "";
    try {
      const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "طلب غير صالح");
      document.getElementById("answer").textContent = data.answer;
      document.getElementById("sources").innerHTML = data.sources.map((s, i) => `
        <div class="card source"><div class="title">[${i + 1}] ${escape(s.title)}</div><div class="text">${escape(s.text)}</div></div>`).join("");
      document.getElementById("out").classList.remove("hidden");
    } catch (err) {
      document.getElementById("error").textContent = err.message;
    } finally {
      go.disabled = false; go.textContent = "اسأل";
    }
  }
</script>
</body>
</html>
